name = "sparse_hnsw_search"
title = "Search sparse HNSWM on MSMARCO"
description = "Search sparse HNSWM on MSMARCO with memory budget 1.5"
dataset = "Splade cocondenser on MS-MARCO"
build-command = "./target/release/hnsw_plain_sparse_build"
query-command = "./target/release/hnsw_plain_sparse_run"

[settings]
k = 10
n-runs = 1
NUMA = "numactl --physcpubind='0-15' --localalloc"
build = true
metric = "RR@10"

[folder]
data = "/pscratch/sd/d/dhaura/datasets/SpKNN/kannolo/experiments/msmarco-splade"
index = "/pscratch/sd/d/dhaura/datasets/SpKNN/kannolo/experiments/msmarco-splade"
qrels_path = "/pscratch/sd/d/dhaura/datasets/SpKNN/kannolo/experiments/msmarco-splade/qrels.dev.small.tsv"
experiment = "."

[filename]
dataset = "dataset.bin"
queries = "queries.bin"
groundtruth = "groundtruth.tsv"
doc_ids = "doc_ids.npy"
query_ids = "queries_ids.npy"
index = "ecir_2025_splade"

[indexing_parameters]
m = 32
efc = 2000
metric = "ip"

[query.efs_10]
ef-search = 10

[query.efs_20]
ef-search = 20

[query.efs_40]
ef-search = 40

[query.efs_80]
ef-search = 80

[query.efs_120]
ef-search = 120

[query.efs_200]
ef-search = 200

[query.efs_400]
ef-search = 400

[query.efs_600]
ef-search = 600

[query.efs_800]
ef-search = 800
